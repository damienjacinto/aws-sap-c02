site_name: AWS SAP-C02 — Decision Trees
site_description: Study notes for the AWS Certified Solutions Architect – Professional exam, organized around the decisions the exam tests.
site_url: https://damienjacinto.github.io/aws-sap-c02/
repo_url: https://github.com/damienjacinto/aws-sap-c02
repo_name: damienjacinto/aws-sap-c02
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false

extra_css:
  - stylesheets/flashcards.css

extra_javascript:
  - javascripts/flashcards.js

nav:
  - Home: index.md
  - Curriculum: curriculum.md
  - Decisions:
      - decisions/index.md
      - Identity & access:
          - Will this request be allowed?: decisions/identity/policy-evaluation.md
          - Cross-account access: decisions/identity/cross-account-access.md
          - "Multi-account foundations": decisions/identity/multi-account.md
          - "Federation & directories": decisions/identity/federation-directories.md
      - Security & monitoring:
          - "KMS key types": decisions/security/kms-key-types.md
          - "Secrets Manager vs Parameter Store": decisions/security/secrets-storage.md
          - "CloudTrail: react, alert or keep the logs?": decisions/security/cloudtrail.md
          - "Security services: GuardDuty, Inspector, Security Hub…": decisions/security/security-services.md
          - "Network protection: SG, NACL, WAF, Shield, Network Firewall": decisions/security/network-protection.md
      - Compute:
          - "ASG scaling policies": decisions/compute/asg-scaling-policies.md
          - "Spot fleets": decisions/compute/spot-fleets.md
          - "Lambda, ECS, EKS, Fargate or Batch": decisions/compute/containers-serverless.md
      - Networking:
          - "Route 53 routing policies": decisions/networking/route53-routing-policies.md
          - "Hybrid DNS: Resolver endpoints & rules": decisions/networking/hybrid-dns.md
          - "Cross-zone load balancing": decisions/networking/elb-cross-zone.md
          - IPv6 with Elastic Load Balancing: decisions/networking/elb-ipv6.md
          - "Direct Connect: VIFs & resiliency": decisions/networking/direct-connect.md
          - "VPC to VPC: peering, TGW, PrivateLink, Lattice": decisions/networking/vpc-connectivity.md
          - "Edge: CloudFront or Global Accelerator": decisions/networking/cloudfront-global-accelerator.md
      - Storage:
          - "Backup: DLM vs AWS Backup vs native": decisions/storage/backup-strategy.md
          - "EFS performance & storage classes": decisions/storage/efs-performance-storage.md
          - "S3 storage classes": decisions/storage/s3-storage-classes.md
          - "FSx: flavor, deployment & failover": decisions/storage/fsx.md
          - "Storage Gateway": decisions/storage/storage-gateway.md
          - "DataSync vs Transfer Acceleration vs gateways": decisions/storage/data-transfer.md
      - Databases:
          - "RDS Proxy": decisions/databases/rds-proxy.md
          - "RDS auto scaling": decisions/databases/rds-auto-scaling.md
          - "DynamoDB RCU / WCU": decisions/databases/dynamodb-capacity.md
          - "Multi-Region databases": decisions/databases/multi-region-databases.md
      - Resilience:
          - "Disaster recovery strategy": decisions/resilience/dr-strategy.md
      - Application integration:
          - "Messaging: SQS, SNS, EventBridge, Kinesis, MQ": decisions/integration/messaging.md
      - Migration:
          - "The 7 Rs": decisions/migration/seven-rs.md
          - "Migration tools": decisions/migration/migration-tools.md
      - Analytics:
          - "Redshift": decisions/analytics/redshift.md
      - Machine learning:
          - "AI services": decisions/ml/ai-services.md
      - IoT:
          - "IoT services & examples": decisions/iot/iot-services.md
  - Flashcards: flashcards.md
  - Exam toolkit:
      - Keywords → answers: keywords.md
      - Mistakes log: mistakes.md
      - Tags: tags.md
